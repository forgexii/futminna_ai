services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: futminna-ai:latest
    container_name: futminna-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      DATABASE_URL: file:/app/data/futminna.db
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - futminna-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # One-off seed job — run with: docker compose --profile tools run --rm seed
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: futminna-ai:builder
    profiles: ["tools"]
    environment:
      DATABASE_URL: file:/app/data/futminna.db
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      - futminna-data:/app/data
    entrypoint: ["sh", "-c"]
    command: ["npx drizzle-kit push --force && npx tsx -r tsconfig-paths/register src/lib/db/seed.ts"]

volumes:
  futminna-data:
